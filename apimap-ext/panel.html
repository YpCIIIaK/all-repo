<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>API Map</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
  <div class="brand">⟡ API Map</div>
  <span class="rec" id="rec" title="Запись"><i></i><span id="rec-t">запись</span></span>
  <span class="stat" id="st-ep">0 эндпоинтов</span>
  <span class="stat" id="st-req">0 запросов</span>
  <span class="stat hot" id="st-find">0 находок</span>
  <span class="stat" id="st-flow">0 потоков</span>
  <input id="q" placeholder="поиск: путь, поле, находка…">
  <select id="scope" title="Какие хосты показывать"><option value="site">только этот сайт</option><option value="all">все хосты</option></select>
  <select id="minsc"><option value="0">все</option><option value="3">риск ≥ 3</option><option value="5">риск ≥ 5</option><option value="8">риск ≥ 8</option></select>
  <button id="b-flow" class="on" title="Показать потоки ID">потоки</button>
  <button id="b-fit" title="Вписать карту">⤢</button>
  <button id="b-exp" title="Развернуть всё">развернуть</button>
  <button id="b-col" title="Свернуть всё">свернуть</button>
  <span class="sp"></span>
  <label class="btn" title="Открыть HAR-файл">HAR…<input type="file" id="f-har" accept=".har,.json" hidden></label>
  <button id="b-export" title="Экспорт модели в JSON">экспорт</button>
  <button id="b-clear" title="Очистить данные этого сайта">очистить</button>
  <button id="b-theme" title="Тема">◐</button>
</header>
<main>
  <section id="map">
    <svg id="svg"></svg>
    <div class="legend">риск <b style="background:var(--ok)"></b>0–2 <b style="background:var(--warn)"></b>3–5 <b style="background:var(--hot)"></b>6–8 <b style="background:var(--crit)"></b>9+ <span class="hint">клик — детали · ▸ — свернуть · колесо — масштаб</span></div>
    <div class="empty-map" id="empty-map">Ходите по сайту — карта строится по мере запросов.<br><small>Или откройте HAR-файл кнопкой «HAR…».</small></div>
  </section>
  <aside>
    <nav class="tabs">
      <button data-t="rank" class="on">Слабые места</button>
      <button data-t="det">Детали</button>
      <button data-t="find">Находки</button>
      <button data-t="flow">Потоки</button>
      <button data-t="tech">Стек</button>
    </nav>
    <div class="pane on" id="p-rank"></div>
    <div class="pane" id="p-det"><div class="empty">Выберите узел на карте, строку в ленте или в рейтинге.</div></div>
    <div class="pane" id="p-find"></div>
    <div class="pane" id="p-flow"></div>
    <div class="pane" id="p-tech"></div>
  </aside>
  <section id="timeline">
    <div class="tl-head"><span>Лента запросов</span><label><input type="checkbox" id="tl-follow" checked> следить</label><label><input type="checkbox" id="tl-onlyapi" checked> только API</label></div>
    <div id="tl"></div>
  </section>
</main>
<script src="lib/d3.min.js"></script>
<script src="engine.js"></script>
<script src="panel.js"></script>
</body>
</html>
