<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Физлаб 3D</title>
<meta name="description" content="Онлайн-песочница трёхмерной физики: тела, пружины, шарниры, моторы, сценарии.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
</head>
<body>
<canvas id="view" aria-label="Трёхмерная сцена физического моделирования"></canvas>
<div id="labels"></div>

<header id="topbar" class="plate">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 3h16"/><path d="M12 3l5 12"/><circle cx="17.6" cy="16.6" r="3.4" fill="currentColor" stroke="none"/><path d="M12 3 7.4 14" opacity=".35" stroke-dasharray="2 2.4"/></svg>
    <b>Физлаб 3D</b>
  </div>
  <button id="sceneName" class="scene-name" title="Сцена — открыть вкладку «Сценарии»">…</button>
  <span class="state-pill">пауза</span>
  <div class="spacer"></div>
  <button class="ibtn" data-act="reset" data-icon="reset" title="Сброс к началу (Home)" aria-label="Сброс к началу"></button>
  <button class="ibtn play" data-act="play" title="Пуск / пауза (Пробел)" aria-label="Пуск или пауза"></button>
  <button class="ibtn" data-act="step" data-icon="step" title="Один шаг (N)" aria-label="Один шаг"></button>
  <select id="speedSel" class="speed" title="Скорость времени" aria-label="Скорость времени"></select>
  <span class="vsep"></span>
  <button class="ibtn" data-act="undo" data-icon="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить"></button>
  <button class="ibtn" data-act="redo" data-icon="redo" title="Повторить (Ctrl+Y)" aria-label="Повторить"></button>
  <button class="ibtn hide-sm" data-act="fit" data-icon="fit" title="Показать всё (F)" aria-label="Показать всё"></button>
  <button class="ibtn hide-sm" data-act="theme" title="Тема оформления" aria-label="Сменить тему"></button>
  <button class="ibtn hide-sm" data-act="help" data-icon="help" title="Справка (?)" aria-label="Справка"></button>
  <button class="ibtn" data-act="panel" data-icon="panel" title="Панель свойств (Tab)" aria-label="Панель свойств"></button>
</header>

<nav id="toolbar" class="plate" aria-label="Инструменты"></nav>

<aside id="panel" class="plate" aria-label="Свойства">
  <div id="tabs" role="tablist"></div>
  <div id="panelBody"></div>
</aside>

<div id="stats" class="plate"></div>
<div id="hint" class="plate empty"></div>
<canvas id="graph" class="plate" aria-label="График энергии"></canvas>
<div id="toasts" aria-live="polite"></div>
<div id="ctxmenu" class="plate" role="menu"></div>
<div id="modal" role="dialog" aria-modal="true" aria-label="Справка">
  <div class="modal-card plate">
    <button class="ibtn modal-close" data-close data-icon="close" aria-label="Закрыть"></button>
    <div id="modalBody"></div>
  </div>
</div>
<input id="fileInput" type="file" accept=".json,application/json" hidden>

<div id="loading">
  <div class="load-card">
    <div class="spinner"></div>
    <b>Физлаб 3D</b>
    <p>Загружаем физический движок…</p>
  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
